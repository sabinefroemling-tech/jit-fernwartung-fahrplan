<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interaktives OT-Security-Werkzeug: bewertet die OT-Fernwartung entlang des Vier-Stufen-Modells und erzeugt einen individuellen Umsetzungsfahrplan. Läuft vollständig lokal im Browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0a33'/%3E%3Cpath d='M14 44 32 18l20 26z' fill='none' stroke='%237a5cff' stroke-width='2.5'/%3E%3Ccircle cx='32' cy='18' r='4' fill='%2341cdf4'/%3E%3Ccircle cx='14' cy='44' r='4' fill='%23d6246e'/%3E%3Ccircle cx='52' cy='44' r='4' fill='%232fe39b'/%3E%3C/svg%3E">
<title>JIT-Fernwartungs-Fahrplan · Companion zum Buch</title>
<style>
/* Lokale Schriften — kein Abruf bei Google Fonts (vgl. LG München I, 3 O 17493/20) · SIL OFL 1.1 */
@font-face{font-family:'Fraunces';src:url('fonts/fraunces-latin-opsz-normal.woff2') format('woff2-variations'),url('fonts/fraunces-latin-opsz-normal.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'JetBrains Mono';src:url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2-variations'),url('fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2');font-weight:100 800;font-style:normal;font-display:swap;}
:root{--red:#2240c4;--red-soft:#dfe4fa;--ink:#181840;--paper:#f5f6fb;--line:#d8dcef;--muted:#5d6184;
--ok:#1d8a5f;--teil:#b97e0a;--offen:#d6246e;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'JetBrains Mono',monospace;background:var(--paper);color:var(--ink);line-height:1.5;
background-image:radial-gradient(var(--line) .5px,transparent .5px);background-size:22px 22px;}
.wrap{max-width:1180px;margin:0 auto;padding:38px 20px 80px;}
header{border-bottom:3px solid var(--ink);padding-bottom:18px;margin-bottom:18px;}
.kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--red);font-weight:600;}
h1{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(24px,4.2vw,40px);line-height:1.05;margin:8px 0 10px;}
.sub{font-size:13px;color:var(--muted);max-width:880px;}
.sig{color:var(--red);font-weight:600;}
.ref{font-size:11px;color:var(--muted);font-style:italic;margin-top:6px;}
h2{font-family:'Fraunces',serif;font-size:20px;margin:26px 0 6px;}
.note{font-size:12px;color:var(--muted);margin-bottom:10px;max-width:880px;}
details{margin:12px 0;background:#fff;border:1px solid var(--line);padding:10px 14px;}
summary{cursor:pointer;font-weight:600;font-size:12px;}
details p,details li{font-size:11.5px;color:var(--muted);margin-top:6px;}
details ul{margin-left:18px;}
.btn{font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
padding:10px 15px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;transition:.15s;}
.btn.ghost{background:transparent;color:var(--ink);} .btn:hover{background:var(--red);border-color:var(--red);color:#fff;}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 0;align-items:center;}
.warn{background:#fff7e6;border:1px solid #b97e0a;color:#7a5306;font-size:11.5px;padding:9px 12px;margin:10px 0;}
footer{margin-top:34px;border-top:1px solid var(--line);padding-top:15px;font-size:11px;color:var(--muted);line-height:1.7;}

/* Bestandsaufnahme */
.werkbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--ink);padding:10px 14px;margin:12px 0;}
.werkbar label{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;}
.werkbar input{border:1px solid var(--line);background:var(--paper);font-family:inherit;font-size:12px;padding:4px 6px;}
.werkbar input.w{min-width:240px;}
.q{background:#fff;border:1px solid var(--line);padding:10px 14px;margin:9px 0;}
.q .qt{font-size:12px;font-weight:600;margin-bottom:7px;}
.q .qt b{color:var(--red);}
.opts{display:flex;flex-wrap:wrap;gap:6px;}
.opt{font-size:11.5px;padding:5px 10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;border-radius:2px;}
.opt:hover{border-color:var(--ink);}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink);}

/* Fahrplan */
.headline{background:var(--ink);color:#fff;padding:12px 16px;margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
.headline .t{font-family:'Fraunces',serif;font-weight:800;font-size:18px;}
.headline .next{font-size:11px;color:var(--red-soft);}
.stage{background:#fff;border:1px solid var(--ink);border-top:0;}
.stage:first-of-type{border-top:1px solid var(--ink);}
.stagehead{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.stagehead .sn{font-family:'Fraunces',serif;font-weight:800;font-size:15px;}
.stagehead .st{font-weight:600;font-size:13px;flex:1;min-width:150px;}
.pill{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:#fff;padding:3px 9px;}
.stagebody{padding:10px 14px;}
.gap{font-size:11.5px;margin-bottom:9px;}
.gap b{color:var(--red);}
.tmpl{background:var(--paper);border:1px solid var(--line);margin-top:8px;}
.tmplhead{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.tmplbody{padding:10px 12px;font-size:11.5px;}
.tmplbody ul{margin-left:17px;}
.tmplbody li{margin:3px 0;}
.tmplbody pre{white-space:pre-wrap;font-family:inherit;font-size:11px;line-height:1.55;}
.copybtn,.csvbtn{font-family:inherit;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;padding:4px 9px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;}
.copybtn:hover,.csvbtn:hover{background:var(--ink);color:#fff;}
.legalbox{border:1px solid var(--teil);background:#fff7e6;padding:9px 12px;margin-top:8px;font-size:11.5px;color:#7a5306;}
.legalbox b{color:#7a5306;}
.disc{font-size:10.5px;color:var(--muted);font-style:italic;margin-top:7px;}
.audit{font-size:11px;color:var(--muted);}
.audit td{border:1px solid var(--line);padding:4px 7px;}
.audit table{border-collapse:collapse;width:100%;background:#fff;margin-top:5px;}
.audit th{background:var(--ink);color:#fff;font-size:10px;padding:4px 7px;text-align:left;}

.print-only{display:none;}
@media print{
  body{background:none;}
  .wrap{padding:0;max-width:none;}
  .noprint{display:none!important;}
  .print-only{display:block;}
  .tmpl,.stage,.q{break-inside:avoid;}
  @page{margin:14mm;}
}
.langsw{position:absolute;top:0;right:0;display:flex;border:1px solid var(--ink);}
.langsw button{font-family:inherit;font-size:11px;font-weight:600;padding:5px 11px;border:0;background:transparent;color:var(--ink);cursor:pointer;letter-spacing:1px;}
.langsw button.on{background:var(--ink);color:#fff;}
@media print{.langsw{display:none}}

/* ================= Reihen-Design v2 (Buchcover) ================= */
header.sf-cover{position:relative;overflow:hidden;background:#0a0a33;border-bottom:0;padding:0;margin:0;}
.sf-cover svg.plx{position:absolute;inset:0;width:100%;height:100%;}
.sf-cover-in{position:relative;max-width:1180px;margin:0 auto;padding:46px 20px 34px;}
.sf-cover .kicker{color:#41cdf4;}
.sf-cover h1{color:#fff;text-shadow:0 1px 14px rgba(6,6,31,.55);}
.sf-cover .sub{color:#ccd1f2;}
.sf-cover .sig{color:#ff5fa8;}
.sf-cover .ref{color:#9aa0d6;}
.sf-cover .langsw{position:absolute;top:18px;right:20px;border:1px solid rgba(232,234,255,.45);}
.sf-cover .langsw button{color:#e8eaff;}
.sf-cover .langsw button.on{background:#e8eaff;color:#10104a;}
.sf-rule{height:4px;background:linear-gradient(90deg,#d6246e,#7a5cff 35%,#41cdf4 72%,#2fe39b);}
.wrap{padding-top:26px;}
.sf-glance{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);padding:16px 18px 8px;margin:6px 0 20px;}
.sf-glh{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:8px;}
.sf-glg{display:grid;grid-template-columns:1fr;margin:0;}
.sf-glg>div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:7px 0;border-top:1px dashed var(--line);}
.sf-glg>div:first-child{border-top:0;}
.sf-glg dt{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px;}
.sf-glg dd{font-size:12.5px;margin:0;line-height:1.55;}
.sf-legal{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;font-size:10.5px;color:var(--muted);line-height:1.65;max-width:980px;}
.sf-legal a{color:var(--muted);}
.sf-footband{position:relative;overflow:hidden;background:#0a0a33;margin-top:42px;}
.sf-footband svg.plx{position:absolute;inset:0;width:100%;height:100%;opacity:.9;}
.sf-foot-in{position:relative;max-width:1180px;margin:0 auto;padding:26px 20px 30px;}
.sf-foot-in footer{margin:0;border:0;padding:0;font-size:11px;color:#c7cbee;line-height:1.7;}
.sf-foot-in footer b{color:#fff;}
.sf-foot-in footer a{color:#9fd9f6;}
.sf-colo{margin-top:14px;padding-top:12px;border-top:1px solid rgba(199,203,238,.28);font-size:10.5px;color:#9aa0d6;line-height:1.9;}
.sf-colo a{color:#c7cbee;}
.sf-printhead{display:none;}
@keyframes sfPulse{0%,100%{opacity:.55}50%{opacity:1}}
.plx .ndp{animation:sfPulse 5s ease-in-out infinite;}
@media (prefers-reduced-motion:reduce){.plx .ndp{animation:none;}}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
@media print{
 .noprint,header.sf-cover,.sf-rule,.sf-glance,.sf-legal,.sf-footband{display:none!important}
 .sf-printhead{display:block;text-align:center;font-size:10px;color:#000;margin-bottom:6px;}
}
@media (max-width:620px){
 .sf-cover-in{padding:40px 16px 26px;}
 .sf-glg>div{grid-template-columns:1fr;gap:2px;}
 .sf-cover .langsw{top:12px;right:12px;}
}
</style>
</head>

de:{
 title:"JIT-Fernwartungs-Fahrplan · Companion zum Buch",

 h1:"JIT-Fernwartungs-Fahrplan",
 sub:"Fernwartung ist der häufigste Eintrittsvektor in der OT. Dieses Werkzeug erzeugt aus wenigen Angaben einen individuellen Fahrplan entlang des Vier-Stufen-Modells — <b>Inventar → Deaktivierung (Just-in-Time) → Single-Channel → Session-Recording</b> — inklusive Register-Vorlage, JIT-Checkliste, Richtlinien-Formulierung und Betriebsvereinbarungs-Muster. <span class='sig'>§</span> Alles bleibt im Browser.",
 ref:"Methodik nach „ISMS für die Industrie\u201c, Kap. 22.2 (Vier-Stufen-Modell), 15.4 (Fernwartung/Jump-Host) und 26.6 (Verarbeitungsverzeichnis). Rechtsbezug: §87 Abs. 1 Nr. 6 BetrVG, DSGVO.",
 dsum:"Das Vier-Stufen-Modell, die Voraussetzungen & die Rechtslage (lesen)",
 dbody:"<p><b>Stufe 1 — Inventar:</b> Alle Fernwartungszugänge im Register erfassen (wer, welches System, seit wann, warum, welches Protokoll), jeweils mit eindeutiger ID und benanntem Owner.</p><p><b>Stufe 2 — Deaktivierung im Ruhezustand:</b> Zugänge standardmäßig deaktiviert; Aktivierung nur auf zeitlich begrenzten Antrag, automatische Deaktivierung nach Auftragsende (Just-in-Time).</p><p><b>Stufe 3 — Single-Channel:</b> Nur ein genehmigter Weg über das zentrale, protokollierte Gateway — kein direktes RDP, kein eigenständiges Hersteller-VPN, keine Schatten-Tools.</p><p><b>Stufe 4 — Session-Recording:</b> Vollständige Aufzeichnung jeder Session, Aufbewahrung mindestens 90 Tage, Zugriff nur durch OT-Security-Team, im Vorfall durch Forensik.</p><p><b>Voraussetzungen (Kap. 22.2):</b> zentrales Gateway mit MFA, Genehmigungs-Workflow, Recording-Infrastruktur, Schulung der externen Dienstleister. Die Investition rechnet sich erfahrungsgemäß in 12–24 Monaten.</p><p><b>Rechtslage (häufigster Fehler):</b> Session-Recording wird eingeführt, ohne die personenbezogene Konstellation zu klären. Korrekte Reihenfolge: (1) Datenströme klären (rein OEM oder gemischt mit internem Personal), (2) Aufnahme ins Verarbeitungsverzeichnis, (3) Betriebsvereinbarung <i>nur sofern interne Mitarbeiter erfasst werden</i> (§87 Abs. 1 Nr. 6 BetrVG), (4) Auftragsverarbeitungsvertrag mit externen Dienstleistern.</p>",

en:{
 title:"JIT Remote Maintenance Roadmap · Book companion",
 kicker:"OT Security · Book companion",
 h1:"JIT Remote Maintenance Roadmap",
 sub:"Remote maintenance is the most common entry vector into OT. From a few inputs, this tool generates an individual roadmap along the four-stage model — <b>inventory → deactivation at rest (just-in-time) → single channel → session recording</b> — including a register template, JIT checklist, policy wording and a works-agreement template. <span class='sig'>§</span> Everything stays in your browser.",
 ref:"Methodology per \u201cIndustrial ISMS for OT Environments\u201d, ch. 11.2 (four-stage model; template T-11 in ch. 30), 9.4 (jump hosts & sanitization stations) and 26.7 (record of processing activities). Legal basis (Germany): §87(1) no. 6 BetrVG, GDPR.",
 dsum:"The four-stage model, the prerequisites & the legal situation (read me)",
 dbody:"<p><b>Stage 1 — Inventory:</b> record all remote access paths in the register (who, which system, since when, why, which protocol), each with a unique ID and a named owner.</p><p><b>Stage 2 — Deactivation at rest:</b> access disabled by default; activation only on a time-limited request, automatic deactivation when the job ends (just-in-time).</p><p><b>Stage 3 — Single channel:</b> only one approved path via the central, logged gateway — no direct RDP, no standalone vendor VPN, no shadow tools.</p><p><b>Stage 4 — Session recording:</b> full recording of every session, retention at least 90 days, access only by the OT security team, in an incident also by forensics.</p><p><b>Prerequisites (ch. 11.2):</b> central gateway with MFA, approval workflow, recording infrastructure, training of external service providers. Experience shows the investment pays back within 12–24 months.</p><p><b>Legal situation (most common mistake — Germany):</b> session recording is introduced without clarifying the personal-data constellation. Correct sequence: (1) clarify data flows (purely OEM, or mixed with internal staff), (2) entry in the record of processing activities, (3) works agreement <i>only if internal employees are captured</i> (§87(1) no. 6 BetrVG, the German Works Constitution Act), (4) data processing agreement with external service providers. Outside Germany, check the local co-determination and privacy rules accordingly.</p>",
 h2a:"Step 1 — Current-state assessment",
 lWerk:"Plant / site",phWerk:"e.g. Hanover plant",lDatum:"Date",
 h2b:"Step 2 — Your individual roadmap",
 noteb:"The roadmap marks each stage's status (achieved / partial / open) and provides the matching templates. The print view produces the complete PDF including all templates.",
 bsave:"Save (JSON)",bload:"Load (JSON)",bcsv:"Register template (CSV)",bprint:"Print roadmap / PDF",
 sfGlance:"<div class='sf-glh'>At a glance</div><dl class='sf-glg'><div><dt>Purpose</dt><dd>Assesses the maturity of OT remote maintenance — the most common entry vector — and turns it into a concrete implementation roadmap.</dd></div><div><dt>How to use</dt><dd>Answer the current-state assessment via multiple-choice questions. The tool maps your answers onto the four-stage model: inventory → JIT deactivation → single channel → session recording.</dd></div><div><dt>Result</dt><dd>An individual roadmap with a register template, JIT checklist, policy wording and a works-agreement template — printable and exportable as CSV.</dd></div></dl>",
 sfLegal:"<b>Usage notes (disclaimer).</b> This tool is a methodical working aid for self-assessment and documentation. It replaces neither individual security or legal advice, nor a risk analysis, nor on-site technical verification. References to standards are for orientation and are not a statement of conformity. Results are based solely on your own input; all information is provided without warranty. Use is at your own responsibility; liability for accuracy, completeness, currency and fitness for a particular purpose is — to the extent legally permissible — excluded.",

let lang="de";
const L=()=>TXT[lang];

let state={};
function initState(){state={werk:"",datum:todayISO(),ans:{}};QUESTIONS.forEach(q=>state.ans[q.key]=null);}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(iso){if(!iso)return '';const p=String(iso).split('-');if(p.length!==3)return iso;return lang==="en"?p[0]+'-'+p[1]+'-'+p[2]:p[2]+'.'+p[1]+'.'+p[0];}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function werkName(){return (state.werk&&state.werk.trim())?state.werk.trim():L().werkPh;}

/* ---- statisches i18n ---- */
function applyLang(){
  document.documentElement.lang=lang;
  document.title=L().title;
  document.querySelectorAll("[data-t]").forEach(el=>el.innerHTML=L()[el.dataset.t]);
  document.getElementById("werk").placeholder=L().phWerk;
  document.getElementById("lde").classList.toggle("on",lang==="de");
  document.getElementById("len").classList.toggle("on",lang==="en");
}
function setLang(l){lang=l;try{const u=new URL(location);u.searchParams.set('lang',l);history.replaceState(null,'',u);}catch(e){}applyLang();renderQuestions();renderPlan();}

/* ---- Fragen-Rendering (kanonische DE-Werte, übersetzte Anzeige) ---- */
function renderQuestions(){
  const wrap=document.getElementById('questions');wrap.innerHTML='';
  QUESTIONS.forEach(q=>{
    const div=document.createElement('div');div.className='q';
    let h=`<div class="qt">${esc(L().q[q.key])}</div><div class="opts">`;
    q.opts.forEach(o=>{const sel=state.ans[q.key]===o?' sel':'';
      h+=`<span class="opt${sel}" onclick="setAns('${q.key}','${esc(o).replace(/'/g,"\\'")}')">${esc(opt(o))}</span>`;});
    h+=`</div>`;div.innerHTML=h;wrap.appendChild(div);
  });
}
function setAns(k,v){state.ans[k]=v;renderQuestions();renderPlan();}

/* ---- Status-Logik (kanonische DE-Werte) ---- */
function statusInfo(s){const T=L().status;return s==='erreicht'?{c:'var(--ok)',l:T.erreicht}:(s==='teilweise'?{c:'var(--teil)',l:T.teilweise}:(s==='offen'?{c:'var(--offen)',l:T.offen}:{c:'var(--muted)',l:T.none}));}
function stage1Status(){const r=state.ans.register;if(!r)return null;return r==='Ja, vollständig'?'erreicht':(r==='Teilweise'?'teilweise':'offen');}
function stage2Status(){const o=state.ans.oem,a=state.ans.access;if(!o||!a)return null;
  if(o==='Nein, keine dauerhaften'&&a==='Ticket-System mit Genehmigung')return 'erreicht';
  if(o==='Ja, mehrere dauerhafte'||a==='Informell / telefonisch'||a==='Kein definierter Prozess')return 'offen';
  return 'teilweise';}
function stage3Status(){const g=state.ans.gateway,m=state.ans.mfa,o=state.ans.oem;if(!g||!m)return null;
  if(g==='Ja, zentral'&&m==='Ja'&&o==='Nein, keine dauerhaften')return 'erreicht';
  if(g==='Nein')return 'offen';
  return 'teilweise';}
function stage4Status(){const r=state.ans.recording;if(!r)return null;return r==='Ja, alle Sessions'?'erreicht':(r==='Nur Crown-Jewel-Systeme'?'teilweise':'offen');}

/* ---- Personalisierte Lücken-Hinweise ---- */
function gap1(){const r=state.ans.register,T=L().gap1;
  if(r==='Ja, vollständig')return T.ok;
  if(r==='Teilweise')return T.part;
  if(r==='Nein')return T.no;
  return T.na;}
function gap2(){const o=state.ans.oem,a=state.ans.access,T=L().gap2;
  let t=[];
  if(o==='Ja, mehrere dauerhafte')t.push(T.oemMany);
  else if(o==='Einzelne')t.push(T.oemFew);
  if(a==='E-Mail-Anfrage')t.push(T.mail);
  if(a==='Informell / telefonisch'||a==='Kein definierter Prozess')t.push(T.none);
  if(!t.length)t.push(T.ok);
  return t.join(' ');}
function gap3(){const g=state.ans.gateway,m=state.ans.mfa,T=L().gap3;
  let t=[];
  if(g==='Nein')t.push(T.noGw);
  else if(g==='Teilweise / mehrere Wege')t.push(T.multi);
  if(m==='Nein')t.push(T.noMfa);
  if(!t.length)t.push(T.ok);
  return t.join(' ');}
function gap4(){const r=state.ans.recording,T=L().gap4;
  if(r==='Ja, alle Sessions')return T.all;
  if(r==='Nur Crown-Jewel-Systeme')return T.cj;
  if(r==='Nein')return T.no;
  return T.na;}

/* ---- Vorlagen (Rechtsdokumente bewusst deutsch — deutsche Rechtsinstrumente) ---- */
function policyText(){return `Richtlinie Fernwartung — Single-Channel-Prinzip (`+werkName()+`)

1. Jede Fernwartung an OT-Systemen erfolgt ausschließlich über das zentrale,
   protokollierte Fernwartungs-Gateway mit Mehr-Faktor-Authentisierung.
2. Direkte Zugänge unter Umgehung des Gateways sind untersagt. Dazu zählen
   insbesondere direktes RDP, eigenständige Hersteller-VPNs, Modem- oder
   Mobilfunk-Router an Anlagen und herstellerseitige Fernwartungs-Boxen ohne
   Freigabe.
3. Neue Fernwartungswege werden ausschließlich nach Freigabe durch den
   OT Security Lead eingerichtet und in das Fernwartungsregister aufgenommen.
4. Bei Entdeckung werden Schatten-Zugänge unverzüglich getrennt und nachträglich
   bewertet.
5. Externe Dienstleister werden auf dieses Prinzip vertraglich verpflichtet;
   Verstöße sind ein Kündigungsgrund des Wartungsvertrags.

Inkrafttreten: `+fmtDate(state.datum)+`   Verantwortlich: OT Security Lead   Geltungsbereich: `+werkName();}

function bvText(){return `Betriebsvereinbarung über Session-Recording bei OT-Fernwartung
(Muster / Formulierungshilfe — `+werkName()+`)

Präambel
Diese Vereinbarung regelt die Aufzeichnung von Fernwartungssitzungen an
Systemen der Operational Technology. Zweck ist ausschließlich die Sicherheit
und Nachvollziehbarkeit von Fernzugriffen. Eine Verhaltens- oder
Leistungskontrolle der Beschäftigten ist ausdrücklich nicht beabsichtigt und
nicht zulässig.

1. Geltungsbereich
   Gilt für alle Fernwartungssitzungen an OT-Systemen im Geltungsbereich
   `+werkName()+`, an denen Beschäftigte des Unternehmens beteiligt sind.

2. Gegenstand der Aufzeichnung
   Aufgezeichnet werden Bildschirminhalt der Fernwartungssitzung sowie Zeitpunkt,
   Dauer und beteiligte Benutzerkennung. Eine darüber hinausgehende Erfassung
   findet nicht statt.

3. Zweckbindung
   Die Aufzeichnungen dienen ausschließlich der Informationssicherheit und der
   forensischen Aufklärung im Vorfallsfall. Eine Auswertung zur Leistungs- oder
   Verhaltenskontrolle ist ausgeschlossen.

4. Zugriffsberechtigte
   Zugriff auf Aufzeichnungen ausschließlich durch das OT-Security-Team; im
   dokumentierten Vorfallsfall zusätzlich durch das Forensik-Team.

5. Aufbewahrung und Löschung
   Aufbewahrung mindestens 90 Tage. Nach Ablauf automatische Löschung, sofern
   kein dokumentierter Sicherheitsvorfall eine längere Aufbewahrung erfordert.

6. Rechte der Beschäftigten
   Information vor Inbetriebnahme, Auskunftsrecht nach DSGVO, Einbindung des
   Datenschutzbeauftragten.

7. Mitbestimmung, Inkrafttreten, Kündigung
   Diese Vereinbarung wird nach §87 Abs. 1 Nr. 6 BetrVG geschlossen. Inkrafttreten
   am [Datum]. Kündigungsfrist [Frist]; Nachwirkung bis zu einer neuen Regelung.

Ort, Datum: ____________________
Für das Unternehmen: ____________   Für den Betriebsrat: ____________`;}

/* ---- Rechtslage Stufe 4 (konstellationsabhängig) ---- */
function legalBlock(){
  const k=state.ans.konstellation,T=L().legal;
  let need;
  if(k==='Gemischt: extern + internes Personal')need=T.mixed;
  else if(k==='Rein externe OEM-Wartung')need=T.oem;
  else if(k==='Unklar / nicht geprüft')need=T.unclear;
  else need=T.none;
  return `<div class="legalbox">${T.seq}<br><br>${need}</div>`;
}

/* ---- Fahrplan-Rendering ---- */
function renderPlan(){
  const T=L();
  const s1=stage1Status(),s2=stage2Status(),s3=stage3Status(),s4=stage4Status();
  const statuses=[s1,s2,s3,s4];
  let nextIdx=statuses.findIndex(x=>x!=='erreicht');
  let nextTxt;
  if(statuses.every(x=>x===null))nextTxt=T.nextFill;
  else if(nextIdx===-1)nextTxt=T.nextDone;
  else nextTxt=T.nextStep(nextIdx+1,T.stagesShort[nextIdx]);

  const print=`<div class="headline"><span class="t">${T.printTitle}</span><span class="next">${esc(werkName())} · ${esc(fmtDate(state.datum))}</span></div>`;
  document.getElementById('printHead').innerHTML=print;

  let h=`<div class="headline noprint"><span class="t">${esc(T.planTitle(werkName()))}</span><span class="next">${esc(nextTxt)}</span></div>`;

  h+=stageCard(1,T.stages[0],s1,gap1(),`
    <div class="tmpl"><div class="tmplhead"><span>${T.tRegister}</span><button class="csvbtn noprint" onclick="downloadRegisterCSV()">${T.tCsv}</button></div>
    <div class="tmplbody"><div class="audit"><table><thead><tr>${T.csvHead.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${T.csvRows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
    <tr>${T.csvHead.map(()=>`<td style="color:var(--muted)">…</td>`).join('')}</tr></tbody></table></div>
    <div class="disc">${T.tRegisterNote}</div></div></div>`);

  h+=stageCard(2,T.stages[1],s2,gap2(),`
    <div class="tmpl"><div class="tmplhead"><span>${T.tCheck}</span></div>
    <div class="tmplbody"><ul>${T.check.map(x=>`<li>☐ ${esc(x)}</li>`).join('')}</ul></div></div>`);

  const deNote=T.deNote?`<div class="disc" style="margin-bottom:6px">${T.deNote}</div>`:"";
  h+=stageCard(3,T.stages[2],s3,gap3(),`
    <div class="tmpl"><div class="tmplhead"><span>${T.tPolicy}</span><button class="copybtn noprint" id="cpol" onclick="copyText('pol','cpol')">${T.tCopy}</button></div>
    <div class="tmplbody">${deNote}<pre id="pol">${esc(policyText())}</pre></div></div>`);

  h+=stageCard(4,T.stages[3],s4,gap4(),
    legalBlock()+`
    <div class="tmpl"><div class="tmplhead"><span>${T.tBv}</span><button class="copybtn noprint" id="cbv" onclick="copyText('bv','cbv')">${T.tCopy}</button></div>
    <div class="tmplbody">${deNote}<pre id="bv">${esc(bvText())}</pre>
    <div class="disc">${T.tBvDisc}</div></div></div>`);

  h+=`<div class="stage"><div class="stagehead"><span class="st">${T.tAudit}</span></div>
    <div class="stagebody audit"><table><thead><tr>${T.auditTh.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
    ${T.audit.map(r=>`<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </tbody></table></div></div>`;

  document.getElementById('plan').innerHTML=h;
}
function stageCard(n,title,status,gap,tmplHtml){
  const si=statusInfo(status);
  return `<div class="stage"><div class="stagehead">
    <span class="sn">${L().stufe} ${n}</span><span class="st">${esc(title)}</span>
    <span class="pill" style="background:${si.c}">${si.l}</span></div>
    <div class="stagebody"><div class="gap">${gap}</div>${tmplHtml}</div></div>`;
}

/* ---- Aktionen ---- */
function copyText(id,btnId){const el=document.getElementById(id);if(!el)return;
  const t=el.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>flash(btnId)).catch(()=>{fallbackCopy(t);flash(btnId);});}
  else {fallbackCopy(t);flash(btnId);}}
function fallbackCopy(t){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
function flash(btnId){const b=document.getElementById(btnId);if(!b)return;const o=b.textContent;b.textContent=L().tCopied;setTimeout(()=>{b.textContent=L().tCopy;},1400);}
function downloadRegisterCSV(){
  const T=L();
  const rows=[T.csvHead,...T.csvRows];
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob=new Blob(["\ufeff"+csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=T.csvName;a.click();
}
function saveJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jit-fernwartung-fahrplan.json';a.click();}
function loadJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d&&d.ans){state.werk=d.werk||"";state.datum=d.datum||todayISO();
      QUESTIONS.forEach(q=>state.ans[q.key]=(q.key in d.ans)?d.ans[q.key]:null);
      syncFields();renderQuestions();renderPlan();}
  }catch(err){alert(L().notRead);}};r.readAsText(f);e.target.value='';}
function syncFields(){const w=document.getElementById('werk');if(w)w.value=state.werk||'';const dt=document.getElementById('datum');if(dt)dt.value=state.datum||'';}

/* ---- Seed: typisches Ausgangsbild ---- */
function seed(){initState();
  state.werk="";state.ans={register:"Teilweise",access:"E-Mail-Anfrage",oem:"Einzelne",gateway:"Teilweise / mehrere Wege",mfa:"Nein",recording:"Nein",konstellation:"Unklar / nicht geprüft"};}
try{if(new URLSearchParams(location.search).get('lang')==='en')lang='en';}catch(e){}
seed();syncFields();applyLang();renderQuestions();renderPlan();
</script>
